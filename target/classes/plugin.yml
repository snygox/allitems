name: AllItems
version: '1.0.0'
main: de.futania.allitems.AllItemsPlugin
author: Hugo
description: Server-weite AllItems-Challenge mit Bossbar-Fortschrittsanzeige, versionsunabhaengig

# Bewusst KEIN "api-version" Feld gesetzt: sobald hier eine konkrete API-Version
# steht (z.B. '1.21'), verweigert der Server das Laden auf allen AELTEREN
# Versionen. Ohne das Feld laedt das Plugin auf so gut wie jeder Bukkit/Spigot/
# Paper-Version (klassisches Verhalten, seit jeher von Bukkit unterstuetzt).

commands:
  skipitem:
    description: Ueberspringt das aktuelle Item der AllItems-Challenge
    usage: /skipitem
    # Kein "permission:" Feld gesetzt -> jeder Spieler darf den Befehl nutzen, kein OP noetig
